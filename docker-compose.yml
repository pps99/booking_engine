services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rezerv_booking
      MYSQL_USER: rezerv
      MYSQL_PASSWORD: rezerv_dev_password
      MYSQL_ROOT_PASSWORD: rezerv_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prezerv_root_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MySql: Server=mysql;Port=3306;Database=rezerv_booking;User=rezerv;Password=rezerv_dev_password;Allow User Variables=true
      Redis__Host: redis
      Redis__Port: 6379
    ports:
      - "5080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:

